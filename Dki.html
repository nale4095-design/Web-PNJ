<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="Dki.css">
</head>
<body>

  <div class="register-box">
    <a href="index.html" class="close-btn">×</a>

    <h2>ĐĂNG KÝ</h2>

    <input type="text" id="username" placeholder="Nhập tên tài khoản">
    <input type="text" id="phone" placeholder="Nhập số điện thoại">
    <input type="text" id="email" placeholder="Nhập email">
    <input type="password" id="password" placeholder="Nhập mật khẩu">
    <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu">

    <a href="login.html" class="login-link">Đã có tài khoản? Đăng nhập</a>

    <button onclick="register()">Đăng ký</button>
    <p id="message"></p>
  </div>

<script>
async function register() {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();
  const msg = document.getElementById("message");

  msg.textContent = "";

  if (!username || !email || !phone || !password || !confirmPassword) {
    msg.style.color = "red";
    msg.textContent = "Vui lòng điền đầy đủ thông tin!";
    return;
  }

  if (password !== confirmPassword) {
    msg.style.color = "red";
    msg.textContent = "Mật khẩu không khớp!";
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/users");
    const users = await res.json();

    const exists = users.find(u =>
      u.username === username ||
      u.email === email ||
      u.phone === phone
    );

    if (exists) {
      msg.style.color = "red";
      msg.textContent = "Tài khoản đã tồn tại!";
      return;
    }

    const newUser = {
      username,
      email,
      phone,
      password
    };

    await fetch("http://localhost:3000/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newUser)
    });

    msg.style.color = "green";
    msg.textContent = "Đăng ký thành công! Đang chuyển sang đăng nhập...";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1200);

  } catch (err) {
    msg.style.color = "red";
    msg.textContent = "Không kết nối được server!";
  }
}
</script>

</body>
</html>
