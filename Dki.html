<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="Dki.css">
</head>
<body>

  <div class="register-box">
    <a href="index.html" class="close-btn">×</a>

    <h2>ĐĂNG KÝ</h2>

    <input type="text" id="username" placeholder="Nhập tên tài khoản">
    <input type="text" id="email" placeholder="Nhập sdt/email">
    <input type="password" id="password" placeholder="Nhập mật khẩu">
    <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu">

    <a href="login.html" class="login-link">Đã có tài khoản? Đăng nhập</a>

    <button onclick="register()">Đăng ký</button>
    <p id="message"></p>
  </div>

  <script>
    async function register() {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const msg = document.getElementById("message");

      if (!username || !email || !phone || !password || !confirmPassword) {
        msg.style.color = "red";
        msg.textContent = "Vui lòng điền đầy đủ thông tin!";
        return;
      }

      if (password !== confirmPassword) {
        msg.style.color = "red";
        msg.textContent = "Mật khẩu và xác nhận mật khẩu không khớp!";
        return;
      }

      try {
        const response = await fetch("users.json");
        const users = await response.json();

        const exists = users.find(u => u.username === username || u.email === email || u.phone === phone);

        if (exists) {
          msg.style.color = "red";
          msg.textContent = "Tài khoản này đã tồn tại!";
        } else {
          msg.style.color = "green";
          msg.textContent = "Đăng ký thành công! Bạn có thể đăng nhập ngay.";
          console.log("Tài khoản mới:", {username, email, phone, password});
        }

      } catch (error) {
        msg.style.color = "red";
        msg.textContent = "Không thể đọc dữ liệu!";
      }
    }
  </script>

</body>
</html>
