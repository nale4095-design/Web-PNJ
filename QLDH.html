<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quản lý đơn hàng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <nav class="sidebar-menu">
        <h4>DANH MỤC QUẢN LÝ</h4>
        <a href="QLTT.html">Quản lý thanh toán</a>
        <a href="QLDH.html" class="active">Quản lý đơn hàng</a>
        <a href="QLKH.html">Quản lý khách hàng</a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <small>© 2025 • Hệ thống admin</small>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-top">
        <div class="avatar-user">
          <div class="icon avatar">👤</div>
          <div class="user-info">NA</div>
        </div>
        <div class="topbar-icons">
          <i>🔔</i>
          <i>⚙️</i>
        </div>
      </div>
      <div class="topbar-bottom">
        <div class="search-box">
          <input placeholder="🔍 Tìm theo mã đơn, tên khách..." />
        </div>
      </div>
    </header>

    <section class="cards">
      <div class="card"><div class="card-title">Tổng đơn hàng</div><div class="card-value">0</div></div>
      <div class="card"><div class="card-title">Đang xử lý</div><div class="card-value pending">0</div></div>
      <div class="card"><div class="card-title">Hoàn thành</div><div class="card-value success">0</div></div>
      <div class="card"><div class="card-title">Hủy</div><div class="card-value fail">0</div></div>
    </section>

    <section class="controls">
      <div class="filter-row">
        <select>
          <option value="">-- Tất cả trạng thái --</option>
          <option value="success">Hoàn thành</option>
          <option value="pending">Đang xử lý</option>
          <option value="fail">Hủy</option>
        </select>
        <input type="date" />
        <input type="date" />
        <button class="btn-pnj">Lọc</button>
        <button class="btn">Làm mới</button>
      </div>
      <div class="action-row">
        <button class="btn-outline">Xuất CSV</button>
        <button class="btn-outline">Xuất PDF</button>
      </div>
    </section>

    <section class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Tên khách hàng</th>
            <th>Số lượng</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Ngày đặt</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
