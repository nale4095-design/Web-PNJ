<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      background: #f9f9f9;
    }

    * {
      margin: 0;
      padding: 0;
      font-family: "Hedvig Letters Serif", serif;
    }

    .login-box {
      display: flex;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      width: 700px;
    }

    .login-form {
      flex: 1;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      color: #333;
      cursor: pointer;
    }

    .close-btn:hover {
      color: red;
    }

    .login-form h2 {
      margin-bottom: 20px;
    }

    .login-form input,
    .login-form select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .login-form button {
      width: 100%;
      padding: 10px;
      background: lightblue;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-form button:hover {
      background: deepskyblue;
      color: white;
    }

    .register {
      text-align: right;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .login-image {
      flex: 1;
      background: url("https://photo.znews.vn/w1920/Uploaded/wyhktpu/2016_07_26/01.png")
        center/cover no-repeat;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-form">
    <a href="index.html" class="close-btn">×</a>

    <img src="https://img.icons8.com/ios-filled/100/000000/user.png">
    <h2>ĐĂNG NHẬP</h2>

    <input type="text" id="username" placeholder="Nhập tên tài khoản">
    <input type="text" id="emailphone" placeholder="Nhập email / số điện thoại">
    <input type="password" id="password" placeholder="Nhập mật khẩu">

    <div class="register">
      <a href="Dki.html">Đăng kí tài khoản</a>
    </div>

    <select id="role">
      <option value="user">Người dùng</option>
      <option value="admin">Quản trị viên</option>
    </select>

    <button onclick="login()">Đăng nhập</button>
    <p id="message"></p>
  </div>

  <div class="login-image"></div>
</div>

<script>
async function login() {
    const userInput = document.getElementById("username").value.trim();
    const emailPhone = document.getElementById("emailphone").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;
    const msg = document.getElementById("message");
    msg.textContent = "";

    try {
        if (role === "admin") {
            const res = await fetch("admin.json");
            const admins = await res.json();

            const admin = admins.find(a =>
                (a.username === userInput || a.email === emailPhone || a.phone === emailPhone) &&
                a.password === password
            );

            if (admin) {
                msg.style.color = "green";
                msg.textContent = "Đăng nhập ADMIN thành công!";
                window.location.href = "dashboard.html";
                return;
            }
        }

        if (role === "user") {
            const res = await fetch("users.json");
            const users = await res.json();

            const user = users.find(u =>
                (u.username === userInput || u.email === emailPhone || u.phone === emailPhone) &&
                u.password === password
            );

            if (user) {
                msg.style.color = "green";
                msg.textContent = "Đăng nhập thành công!";
                window.location.href = "index.html";
                return;
            }
        }

        msg.style.color = "red";
        msg.textContent = "Sai tài khoản hoặc mật khẩu!";

    } catch (err) {
        console.error(err);
        msg.style.color = "red";
        msg.textContent = "Không đọc được dữ liệu!";
    }
}
</script>

</body>
</html>
